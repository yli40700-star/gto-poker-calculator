<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注入回放台 · agent harness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f1115'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23e0533d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-lang="zh">
<header>
  <h1>AGENT HARNESS</h1>
  <span class="sub" data-i18n="sub"></span>
  <nav>
    <button data-page="replay" class="active" data-i18n="navReplay"></button>
    <button data-page="config" data-i18n="navConfig"></button>
    <button data-page="experiments" data-i18n="navExperiments"></button>
  </nav>
  <div class="lang" role="group" aria-label="Language / 语言">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <!-- ============ 回放：整个前端存在的理由 ========= -->
  <section id="replay" class="page active">
    <div class="card">
      <div class="row">
        <div class="grow">
          <label for="game-select" data-i18n="labelGame"></label>
          <select id="game-select"></select>
        </div>
        <div>
          <label for="new-seed" data-i18n="labelNewGame"></label>
          <div class="row" style="gap:6px">
            <input id="new-seed" type="number" value="1" style="width:80px">
            <select id="new-guard" style="width:170px">
              <option value="" data-i18n="guardNone"></option>
              <option value="L1">L1</option>
              <option value="L1,L2" selected>L1+L2</option>
              <option value="L1,L2,L3">L1+L2+L3</option>
            </select>
            <button class="action" id="run-game" data-i18n="btnRun"></button>
          </div>
        </div>
      </div>
      <div id="game-meta" class="mono muted" style="margin-top:10px"></div>
      <div id="timeline" class="timeline"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div id="rounds" class="rounds"></div>

    <div class="card phases">
      <h2 data-i18n="hPhases"></h2>
      <div id="phases"></div>
    </div>

    <div class="replay-grid">
      <div class="card">
        <h2 data-i18n="hSeats"></h2>
        <ul id="players" class="players"></ul>
        <div id="round-summary" class="mono muted" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h2 id="trace-title"></h2>
        <div id="trace"></div>
      </div>
    </div>
  </section>

  <!-- ====================== 配置 ====================== -->
  <section id="config" class="page">
    <div class="card">
      <h2 data-i18n="hProviders"></h2>
      <p class="muted note" data-i18n="providerNote"></p>
      <table id="providers"></table>
      <div class="row" style="margin-top:12px">
        <div><label data-i18n="fKind"></label><select id="p-kind">
          <option value="claude_cli" data-i18n="kindCli"></option>
          <option value="anthropic" data-i18n="kindAnthropic"></option>
          <option value="openai_compat" data-i18n="kindRelay"></option>
        </select></div>
        <div class="grow"><label data-i18n="fName"></label><input id="p-name" placeholder="中转站 · Claude 分组"></div>
        <div class="grow"><label data-i18n="fBaseUrl"></label><input id="p-url" placeholder="https://api.example.com/v1"></div>
        <div class="grow"><label data-i18n="fKey"></label><input id="p-key" type="password" placeholder="sk-..."></div>
        <button class="action" id="add-provider" data-i18n="btnAdd"></button>
      </div>
      <div id="provider-msg" class="hint" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2 data-i18n="hModels"></h2>
      <p class="muted note" data-i18n="modelNote"></p>
      <table id="models"></table>
      <div class="row" style="margin-top:12px">
        <div class="grow"><label data-i18n="fProvider"></label><select id="m-provider"></select></div>
        <div class="grow"><label data-i18n="fDisplay"></label><input id="m-display" placeholder="Sonnet 4.5"></div>
        <div class="grow"><label data-i18n="fModelName"></label><input id="m-name" placeholder="claude-sonnet-4-5"></div>
        <div class="grow"><label data-i18n="fGroup"></label><input id="m-group" placeholder="claude-pool"></div>
        <button class="action" id="add-model" data-i18n="btnAdd"></button>
      </div>
      <div id="model-msg" class="hint" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- ====================== 实验 ====================== -->
  <section id="experiments" class="page">
    <div class="card">
      <h2 data-i18n="hNewBatch"></h2>
      <div class="row">
        <div><label data-i18n="fBatchName"></label><input id="x-name" value="guard ablation"></div>
        <div><label data-i18n="fSeeds"></label><input id="x-seeds" type="number" value="10" style="width:90px"></div>
        <div><label data-i18n="fWorkers"></label><input id="x-workers" type="number" value="3" style="width:80px"></div>
        <div class="grow"><label data-i18n="fModel"></label><select id="x-model"></select></div>
        <div><label data-i18n="fBenign"></label><input id="x-benign" type="checkbox" checked></div>
        <button class="action" id="start-exp" data-i18n="btnStart"></button>
      </div>
      <p class="muted note" data-i18n="batchNote"></p>
    </div>

    <div class="card">
      <h2 data-i18n="hRunning"></h2>
      <div id="exp-progress" class="mono"></div>
      <button class="action danger" id="stop-exp" style="margin-top:10px" data-i18n="btnStop"></button>
    </div>

    <div class="card">
      <h2 data-i18n="hResults"></h2>
      <table id="exp-results"></table>
      <p class="muted note" data-i18n="resultsNote"></p>
    </div>
  </section>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
